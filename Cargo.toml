[workspace]
resolver = "3"
members = ["caps-gui"]

# Rune ships vendored patches for five crates and its own comment says "apps that build Rune
# patch it too": a dependency's [patch] does not reach the workspace that depends on it, so
# without these the build fails on `parley_engine`'s `line-dictionaries` feature.
# These paths assume the Rune checkout next to this one (`../rune`, pinned in caps-gui/Cargo.toml).
[patch.crates-io]
accesskit_macos = { path = "../rune/vendor/accesskit_macos" }
accesskit_windows = { path = "../rune/vendor/accesskit_windows" }
parley_engine = { path = "../rune/vendor/parley_engine" }
wgpu-hal = { path = "../rune/vendor/wgpu-hal" }
winit = { path = "../rune/vendor/winit" }

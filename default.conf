# Example: Caps Lock nav layer for a 102-key DaKai/Defender keyboard (no Home/End/PrtSc)
[ids]
# DaKai USB Keyboard (lsusb: 0e6a:02c0 Megawin "Defender Gaming Keyboard") only
0e6a:02c0

[main]
# tap = Caps Lock, hold = nav layer
capslock = overload(nav, capslock)

[nav]
left = home
right = end
p = sysrq
volumedown = C-minus
volumeup = C-equal
up = pageup
down = pagedown
mute = C-0
